name: Linux test build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        c_compiler: [gcc,clang]
        cpp_compiler: [gcc,clang]
    steps:
      - name: Clone branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Dependencies setup
        run: |
          apt-get update && apt-get install -y sudo
          apt-get install && apt-get install -y build-essential cmake git openssl libssl-dev
      - name: Build
        run: |
          cd build
          /usr/bin/cmake -DCMAKE_BUILD_TYPE=Debug -DDO_TEST=ON .. && /usr/bin/cmake --build .

